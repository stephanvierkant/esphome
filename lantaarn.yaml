---
esphome:
  name: $devicename

substitutions:
  devicename: lantaarn

output:
  - platform: ledc
    id: lantaarn_pwm
    pin: GPIO27

light:
  - platform: monochromatic
    name: Lantaarn
    output: lantaarn_pwm
    icon: mdi:outdoor-lamp

packages:
  common: !include common.yaml
  esp32: !include packages/esp32.yaml
  bluetooth_proxy: !include packages/bluetooth_proxy.yaml
