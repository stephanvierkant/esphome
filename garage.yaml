---
esphome:
  name: $devicename

substitutions:
  devicename: garage

i2c:
  sda: GPIO22
  scl: GPIO21
  scan: true

mcp23017:
  - id: mcp23017_hub
    address: 0x20  # pas aan als A0-A2 op de MCP23017 niet alle drie naar GND gaan

logger:
  level: DEBUG

debug:
  update_interval: 5s

sensor:
  - platform: wifi_signal
    name: "WiFi Signaalsterkte"
    update_interval: 30s
  - platform: uptime
    name: "Uptime"

switch:
  - platform: gpio
    id: relay
    name: Garagedeur openen
    pin:
      mcp23xxx: mcp23017_hub
      number: 0  # PA0
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - delay: 250ms
      - switch.turn_off: relay

binary_sensor:
  - platform: gpio
    pin:
      mcp23xxx: mcp23017_hub
      number: 2  # PA2
      mode: INPUT_PULLUP
    name: Garagedeur volledig dicht
    id: garagedeur_volledig_dicht
    device_class: door
    internal: true

  - platform: gpio
    id: garage_tussendeur
    pin:
      mcp23xxx: mcp23017_hub
      number: 1  # PA1
      mode: INPUT_PULLUP
    name: Tussendeur
    device_class: door

  - platform: gpio
    pin:
      mcp23xxx: mcp23017_hub
      number: 3  # PA3
      mode: INPUT_PULLUP
    name: Garagedeur volledig geopend
    id: garagedeur_volledig_open
    device_class: door
    internal: true

  - platform: gpio
    id: garage_motion
    pin:
      mcp23xxx: mcp23017_hub
      number: 4  # PA4
      mode: INPUT_PULLUP
    filters:
      - delayed_off: 10s
    name: "PIR Sensor"
    device_class: motion

  - platform: template
    id: motion_doors
    device_class: motion
    name: "Beweging deuren"
    lambda: |-
      if (id(garagedeur_volledig_dicht).state && id(garagedeur_volledig_open).state) {
        return true;
      } else if (id(garage_tussendeur).state) {
        return true;
      }
      return false;

  - platform: template
    id: motion_garagedeur
    device_class: motion
    name: "Beweging garagedeur"
    lambda: |-
      if (id(garagedeur_volledig_dicht).state && id(garagedeur_volledig_open).state) {
        return true;
      }
      return false;

cover:
  - platform: template
    name: "Garagedeur"
    device_class: garage

    lambda: |-
      if (id(garagedeur_volledig_dicht).state == false) {
        return COVER_CLOSED;
      } else if (id(garagedeur_volledig_open).state == false) {
        return COVER_OPEN;
      } else {
        return COVER_OPERATION_OPENING;
      }

    open_action:
      - lambda: |-
          if (!id(garage_tussendeur).state) {
            id(relay).turn_on();
          }

    close_action:
      - lambda: |-
          if (!id(garage_tussendeur).state) {
            id(relay).turn_on();
          }

    stop_action:
      - lambda: |-
          if (!id(garage_tussendeur).state) {
            id(relay).turn_on();
          }

packages:
  common: !include common.yaml
  esp32: !include packages/esp32.yaml
  bluetooth_proxy: !include packages/bluetooth_proxy.yaml
